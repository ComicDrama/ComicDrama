name: ci

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prisma:validate --workspace api
        env:
          DATABASE_URL: postgresql://comicdrama:change-me@localhost:5432/comicdrama?schema=public
      - run: npm run prisma:generate --workspace api
        env:
          DATABASE_URL: postgresql://comicdrama:change-me@localhost:5432/comicdrama?schema=public
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build --workspace web
      - run: npm run build --workspace api
      - run: python -m pip install --disable-pip-version-check ruff pytest
      - run: ruff check workers/src workers/tests
      - run: pytest workers/tests
      - run: python -m compileall -q workers/src
